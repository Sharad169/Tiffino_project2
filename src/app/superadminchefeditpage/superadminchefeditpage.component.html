<app-superadmin-sidebar></app-superadmin-sidebar>

<div class="managerinfo-wrapper">
  <div class="tab-container">
    <!-- ================= TAB BAR ================= -->
    <div class="tab-bar">
      <div
        class="tab"
        [class.active]="activeTab === 'info'"
        (click)="setActiveTab('info')"
      >
        Employee Information
      </div>

      <div
        class="tab"
        [class.active]="activeTab === 'blank'"
        (click)="setActiveTab('blank')"
      >
        Changes Requested by Employee
      </div>
    </div>

    <!-- ================= TAB CONTENT ================= -->
    <div class="tab-content">
      <!-- ================= INFO TAB ================= -->
      <div *ngIf="activeTab === 'info'">
        <form class="manager-form">
          <!-- ROW 1 -->
          <div class="form-row">
            <div class="form-group">
              <label>Name</label>
              <input type="text" [value]="employee.name" readonly />
            </div>

            <div class="form-group">
              <label>Email</label>
              <input type="email" [value]="employee.email" readonly />
            </div>
          </div>

          <!-- ROW 2 -->
          <div class="form-row">
            <div class="form-group">
              <label>DOB</label>
              <input type="text" [value]="employee.date" readonly />
            </div>

            <div class="form-group">
              <label>Phone No.</label>
              <input type="text" [value]="employee.phone" readonly />
            </div>
          </div>

          <!-- ROW 3 -->
          <div class="form-row">
            <div class="form-group">
              <label>Kitchen ID</label>
              <input type="text" [value]="employee.kitchenCode" readonly />
            </div>

            <div class="form-group file-group">
              <label>Photo</label>
              <div class="custom-file-input">
                <a
                  *ngIf="employee.photo"
                  [href]="employee.photo"
                  target="_blank"
                  class="view-file"
                >
                  View File
                </a>
                <span *ngIf="!employee.photo">Not Uploaded</span>
              </div>
            </div>
          </div>

          <!-- ROW 4 -->
          <div class="form-row">
            <div class="form-group file-group">
              <label>Aadhar</label>
              <div class="custom-file-input">
                <a
                  *ngIf="employee.aadhar"
                  [href]="employee.aadhar"
                  target="_blank"
                  class="view-file"
                >
                  View File
                </a>
                <span *ngIf="!employee.aadhar">Not Uploaded</span>
              </div>
            </div>

            <div class="form-group file-group">
              <label>PAN Card</label>
              <div class="custom-file-input">
                <a
                  *ngIf="employee.pan"
                  [href]="employee.pan"
                  target="_blank"
                  class="view-file"
                >
                  View File
                </a>
                <span *ngIf="!employee.pan">Not Uploaded</span>
              </div>
            </div>
          </div>

          <!-- ROW 5 -->
          <div class="form-row">
            <div class="form-group">
              <label>Bank Account No.</label>
              <input type="text" [value]="employee.bankAccountNum" readonly />
            </div>

            <div class="form-group file-group">
              <label>Cheque Book</label>
              <div class="custom-file-input">
                <a
                  *ngIf="employee.chequeBook"
                  [href]="employee.chequeBook"
                  target="_blank"
                  class="view-file"
                >
                  View File
                </a>
                <span *ngIf="!employee.chequeBook">Not Uploaded</span>
              </div>
            </div>
          </div>

          <!-- CHEF SPECIALIZATION -->
          <div class="form-group full">
            <label>Chef Specialization</label>
            <textarea class="address-box" readonly
              >{{ employee.chefSpecialization }}
</textarea
            >
          </div>

          <!-- PERMANENT ADDRESS -->
          <div class="form-group full">
            <label>Permanent Address</label>
            <textarea class="address-box" readonly
              >{{ employee.permanentAddress }}
</textarea
            >
          </div>

          <!-- CURRENT ADDRESS -->
          <div class="form-group full">
            <label>Current Address</label>
            <textarea class="address-box" readonly
              >{{ employee.currentAddress }}
</textarea
            >
          </div>
        </form>
      </div>

      <!-- ================= CHANGES TAB ================= -->
      <div *ngIf="activeTab === 'blank'" class="blank-page">
        <div class="action-box">
          <div class="changes-table">
            <div class="table-header">
              <div>Field</div>
              <div>Current Value</div>
              <div>Requested Value</div>
            </div>

            <div class="table-row" *ngFor="let change of changeRequests">
              <div class="field-name">{{ change.fieldName }}</div>
              <div class="old-value">{{ change.currentValue }}</div>
              <div class="new-value">{{ change.requestedValue }}</div>
            </div>
          </div>

          <div class="action-buttons">
            <button class="approve-btn" (click)="approveRequest()">
              Approve
            </button>
            <button class="reject-btn" (click)="rejectRequest()">Reject</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
