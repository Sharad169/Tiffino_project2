<div class="main-layout-wrapper">
  <!-- CONTENT PANEL FIRST (TOP) -->
  <div class="content-panel">
    <div class="top-header-row">
      <p class="greeting">Good Morning, Aaditya</p>

      <div class="action-icons">
        <div class="help-large-box">
          <div class="help-small-box">?</div>
        </div>

        <div class="notification-circle">
          <i class="fas fa-bell notify"></i>
          <img src="/assets/aaditya.jpg" alt="user" class="profile-pic" />
        </div>
      </div>
    </div>

    <div class="search-row">
      <div class="search-box">
        <input type="text" placeholder="Search" />
        <button class="menu-btn">☰</button>
      </div>
    </div>
  </div>

  <!-- SIDEBAR PANEL BELOW -->
  <div class="sidebar-panel">
    <div class="inactive-status">
      <span class="inactive-text">Inactive</span>
      <div class="inactive-dot"></div>
    </div>

    <div class="location-row"></div>

    <div class="profile-section">
      <span class="back-link" (click)="goBack()">
        <i class="fa-solid fa-angle-left"></i> Back
      </span>
    </div>

    <div class="sidebar-nav">
      <ul class="nav-list">
        <li class="nav-item highlight" [class.active]="isActive(homeRoutes)">
          <a routerLink="/chef-dashboard" class="nav-link">Home</a>
        </li>

        <li
          class="nav-item highlight"
          [class.active]="isActive(helpSupportRoutes)"
        >
          <a routerLink="/chef-helpsupportpage" class="nav-link">Help Center</a>
        </li>

        <li class="nav-item highlight" [class.active]="">
          <a routerLink="" class="nav-link">Your Details</a>
        </li>

        <li class="nav-item highlight" [class.active]="">
          <a routerLink="" class="nav-link">Order Details Page</a>
        </li>
      </ul>
    </div>
  </div>
</div>
