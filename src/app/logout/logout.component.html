<div class="profile-container">
  <div class="top-row">
    <div class="top-actions"></div>
  </div>

  <div class="middle-row">
    <span class="location"> </span>
    <div class="search-box"></div>
  </div>
  <div class="bottom-row">
    <div class="back-link" [routerLink]="['/profile']" style="cursor: pointer">
      <i class="fa-solid fa-angle-left"></i> Back
    </div>
  </div>

  <div class="profile">
    <p>Profile</p>
  </div>

  <!-- Main Section -->
  <div class="profile-section">
    <!-- Sidebar -->
    <app-sidebar (logoutClick)="showLogoutPopup()"></app-sidebar>

    <!-- 🔘 Logout Confirmation Popup -->
    <div class="logout-popup" [class.show]="showPopup">
      <div class="popup-box">
        <div class="popup-sidebar"></div>
        <div class="popup-content">
          <h3>Logout?</h3>
          <p>Are you sure you want to logout?</p>
          <div class="popup-actions">
            <button class="yes-btn" (click)="confirmLogout()">Yes</button>
            <button class="no-btn" (click)="closePopup()">No</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Profile Details -->
    <div class="profile-details">
      <div class="user-info">
        <img src="/assets/aaditya.jpg" alt="User" class="user-avatar" />
        <h3>Aditya Dhanraj</h3>
        <p class="email">aditya&#64;gmail.com</p>
      </div>

      <!-- Account Form -->
      <div class="account-form">
        <div class="form-row">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name" />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="text">Text</label>
            <input type="text" id="text" placeholder="Enter text" />
          </div>
          <div class="form-group">
            <label for="phone">Phone No.</label>
            <input type="tel" id="phone" placeholder="Enter phone number" />
          </div>
        </div>
      </div>

      <!--    Notification   -->

      <div class="notifications">
        <div class="content">
          <!--  <h4>Notifications</h4>
          <p class="desc">View and change your notification settings</p>  -->

          <div class="notification-item">
            <p>
              <strong>Notifications</strong><br />View and change your
              notification settings
            </p>
            <label class="switch">
              <input type="checkbox" />
              <span class="slider round"></span>
            </label>
          </div>

          <div class="notification-item">
            <p>
              <strong>Push Notification</strong><br />Enable push notification
            </p>
            <label class="switch">
              <input type="checkbox" />
              <span class="slider round"></span>
            </label>
          </div>

          <div class="notification-item">
            <p>
              <strong>Email Notification</strong><br />Enable email notification
            </p>
            <label class="switch">
              <input type="checkbox" />
              <span class="slider round"></span>
            </label>
          </div>

          <div class="notification-item">
            <p>
              <strong>Inapp Notification</strong><br />Enable inapp notification
            </p>
            <label class="switch">
              <input type="checkbox" />
              <span class="slider round"></span>
            </label>
          </div>
        </div>
      </div>

      <!-- FontAwesome Free CDN -->
      <script
        src="https://kit.fontawesome.com/a076d05399.js"
        crossorigin="anonymous"
      ></script>
    </div>
  </div>
</div>
