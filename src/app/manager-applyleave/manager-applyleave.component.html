<app-managersidebar></app-managersidebar>

<div class="apply-wrapper">
  <h2>Apply for leave</h2>

  <!-- LEAVE TYPE -->
  <div class="dropdown-wrapper">
    <input
      type="text"
      class="input-box leave-type"
      [value]="leaveType || 'Leave type'"
      readonly
      (click)="toggleLeaveTypeDropdown()"
    />

    <div class="custom-dropdown" *ngIf="showLeaveType">
      <p (click)="selectLeaveType('Sick Leave')">Sick Leave</p>
      <p (click)="selectLeaveType('Casual Leave')">Casual Leave</p>
      <p (click)="selectLeaveType('Emergency Leave')">Emergency Leave</p>
    </div>
  </div>

  <div class="small-fields">
    <!-- FROM DATE -->
    <div class="date-wrapper" #fromBox>
      <input
        type="text"
        class="input-box"
        readonly
        [value]="displayFrom || 'From date'"
        (click)="openCalendar('from', fromBox)"
      />
    </div>

    <!-- TO DATE -->
    <div class="date-wrapper" #toBox>
      <input
        type="text"
        class="input-box"
        readonly
        [value]="displayTo || 'To date'"
        (click)="openCalendar('to', toBox)"
      />
    </div>

    <!-- CONTACT -->
    <div class="contact-box">
      <span class="prefix">Contact Details</span>
      <input type="text" class="contact-input" [(ngModel)]="contactDetails" />
    </div>

    <!-- REASON -->
    <div class="reason-box">
      <span class="reason-label">Reason</span>
      <textarea class="reason-textarea" [(ngModel)]="reasonText"></textarea>
    </div>

    <div class="submit-btn">
      <button (click)="submitLeave()">Submit</button>
    </div>
  </div>
</div>

<!-- ================= CALENDAR POPUP ================= -->
<!-- ================= CALENDAR POPUP ================= -->
<div
  class="calendar-popup"
  *ngIf="calendarOpen"
  [style.top.px]="popupTop"
  [style.left.px]="popupLeft"
  (click)="$event.stopPropagation()"
>
  <!-- HEADER -->
  <!-- HEADER -->
  <!-- HEADER -->
  <div class="calendar-header-wrapper">
    <!-- LEFT ARROWS -->
    <div class="nav-group left">
      <button class="nav-btn" (click)="prevYear()">«</button>
      <button class="nav-btn" (click)="prevMonth()">‹</button>
    </div>

    <!-- CENTER TITLE -->
    <div class="calendar-title">
      {{ monthNames[currentMonth] }} {{ currentYear }}
    </div>

    <!-- RIGHT ARROWS -->
    <div class="nav-group right">
      <button class="nav-btn" (click)="nextMonth()">›</button>
      <button class="nav-btn" (click)="nextYear()">»</button>
    </div>
  </div>

  <!-- WEEK HEADER -->
  <div class="calendar-header">
    <div>MON</div>
    <div>TUE</div>
    <div>WED</div>
    <div>THR</div>
    <div>FRI</div>
    <div>SAT</div>
    <div>SUN</div>
  </div>

  <!-- DAYS -->
  <div class="calendar-grid">
    <div
      *ngFor="let d of days"
      class="calendar-day"
      (click)="selectCalendarDate(d)"
    >
      {{ d }}
    </div>
  </div>
</div>
