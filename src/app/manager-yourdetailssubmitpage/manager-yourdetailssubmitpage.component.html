<app-managersidebar></app-managersidebar>

<div class="managerinfo-wrapper">
  <div class="profile-details">
    <!-- ===== PROFILE HEADER (DYNAMIC) ===== -->
    <div class="user-info">
      <img
        [src]="manager?.photo || '/assets/default-user.png'"
        alt="User"
        class="user-avatar"
      />
      <h3>{{ manager?.name || "—" }}</h3>
      <p class="email">{{ manager?.email || "—" }}</p>
    </div>

    <!-- ===== FORM ===== -->
    <form class="manager-form">
      <!-- ROW 1 -->
      <div class="form-row">
        <div class="form-group">
          <label>Name</label>
          <input type="text" [(ngModel)]="name" name="name" />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" [(ngModel)]="email" name="email" />
        </div>
      </div>

      <!-- ROW 2 -->
      <div class="form-row">
        <div class="form-group">
          <label>DOB</label>
          <input type="text" disabled />
        </div>

        <div class="form-group">
          <label>Phone No.</label>
          <input type="text" [(ngModel)]="phone" name="phone" />
        </div>
      </div>

      <!-- ROW 3 -->
      <div class="form-row">
        <div class="form-group">
          <label>Kitchen ID</label>
          <input type="text" disabled />
        </div>

        <div class="form-group file-group">
          <label>Photo</label>
          <div class="custom-file-input">
            <span class="file-placeholder">Choose File</span>
            <input type="file" (change)="onPhotoSelect($event)" />
          </div>
        </div>
      </div>

      <!-- AADHAR + BANK -->
      <div class="form-row">
        <div class="form-group file-group">
          <label>Aadhar</label>
          <div class="custom-file-input">
            <span class="file-placeholder">Choose File</span>
            <input type="file" (change)="onAadharSelect($event)" />
          </div>
        </div>

        <div class="form-group">
          <label>Bank Account No</label>
          <input type="text" disabled />
        </div>
      </div>

      <!-- CHEQUE + IFSC -->
      <div class="form-row">
        <div class="form-group file-group">
          <label>Cheque Book</label>
          <div class="custom-file-input">
            <span class="file-placeholder">Choose File</span>
            <input type="file" (change)="onChequeBookSelect($event)" />
          </div>
        </div>

        <div class="form-group">
          <label>IFSC Code</label>
          <input type="text" disabled />
        </div>
      </div>

      <!-- ADDRESS -->
      <div class="form-group full">
        <label>Permanent Address</label>
        <textarea
          class="address-box"
          [(ngModel)]="permAddress"
          name="permAddress"
        ></textarea>
      </div>

      <div class="form-group full">
        <label>Current Address</label>
        <textarea
          class="address-box"
          [(ngModel)]="currAddress"
          name="currAddress"
        ></textarea>
      </div>
      <div class="form-row">
        <div class="form-group full">
          <label>Note to Admin</label>
          <textarea
            class="address-box"
            [(ngModel)]="noteToAdmin"
            name="noteToAdmin"
            placeholder="Any message for admin..."
          ></textarea>
        </div>
      </div>

      <button type="button" class="start-btn" (click)="submitForm()">
        Submit
      </button>
    </form>
  </div>
</div>

<!-- ===== POPUP ===== -->
<div class="popup-overlay" *ngIf="showPopup">
  <div class="popup-box">
    <span class="popup-close" (click)="closePopup()">✕</span>
    <h2>{{ popupTitle }}</h2>
    <p>{{ popupMessage }}</p>
  </div>
</div>
