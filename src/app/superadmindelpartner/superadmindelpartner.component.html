<app-sidebar2></app-sidebar2>
<div class="managerinfo-wrapper">
  <!-- ✅ Custom Dropdown (No Blue Hover) -->
  <div class="role-selection-row">
    <div class="dropdown-wrapper" tabindex="0">
      <button class="fake-select">
        <span class="label">Delivery Partner</span>
        <span class="chev" aria-hidden="true">
          <svg
            class="dropdown-icon"
            width="40"
            height="40"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M7 10l5 5 5-5"
              stroke="rgba(31, 31, 31, 1)"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </button>

      <ul class="dropdown-panel">
        <li (click)="onRoleChangeCustom('manager')" class="dropdown-item">
          Manager
        </li>
        <li (click)="onRoleChangeCustom('chef')" class="dropdown-item">Chef</li>
        <li
          (click)="onRoleChangeCustom('delivery-partner')"
          class="dropdown-item"
        >
          Delivery Partner
        </li>
      </ul>
    </div>
  </div>

  <!-- Registration form -->
  <form class="manager-form">
    <div class="form-row">
      <div class="form-group">
        <label for="name">Name</label>
        <input id="name" type="text" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="dob">DOB</label>
        <input id="dob" type="text" placeholder="YYYY/MM/DD" />
      </div>
      <div class="form-group">
        <label for="phone">Phone No.</label>
        <input id="phone" type="text" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="kitchen-id">Kitchen ID</label>
        <input id="kitchen-id" type="text" />
      </div>
      <div class="form-group">
        <label for="vehicle-no">Vehicle No.</label>
        <input id="vehicle-no" type="text" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group file-group">
        <label for="aadhar">Aadhar No.</label>
        <div class="custom-file-input">
          <span class="file-placeholder">PDF</span>
          <input id="aadhar" type="file" />
        </div>
      </div>
      <div class="form-group file-group">
        <label for="pan-card">PAN card No.</label>
        <div class="custom-file-input">
          <span class="file-placeholder">PDF</span>
          <input id="pan-card" type="file" />
        </div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group file-group">
        <label for="vehicle-insurance">Vehicle Insurance</label>
        <div class="custom-file-input">
          <span class="file-placeholder">PDF</span>
          <input id="vehicle-insurance" type="file" />
        </div>
      </div>
      <div class="form-group file-group">
        <label for="driving-license">Driving License</label>
        <div class="custom-file-input">
          <span class="file-placeholder">PDF</span>
          <input id="driving-license" type="file" />
        </div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group file-group">
        <label for="photo">Photo</label>
        <div class="custom-file-input">
          <span class="file-placeholder">PDF</span>
          <input id="photo" type="file" />
        </div>
      </div>

      <div class="form-group full">
        <label for="bank-acct">Bank Account No.</label>
        <input id="bank-acct" type="text" />
      </div>
    </div>

    <div class="form-group file-group">
      <label for="cheque-book">Cheque Book</label>
      <div class="custom-file-input">
        <span class="file-placeholder">PDF</span>
        <input id="cheque-book" type="file" />
      </div>
    </div>

    <div class="form-group full">
      <label for="perm-address">Permanent Address</label>
      <textarea id="perm-address" type="text" class="address-box"></textarea>
    </div>

    <div class="form-group full">
      <label for="curr-address">Current Address</label>
      <textarea id="curr-address" type="text" class="address-box"></textarea>
    </div>

    <div class="submit-row">
      <button type="submit">Submit</button>
    </div>
  </form>
</div>
