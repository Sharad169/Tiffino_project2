<app-superadmin-sidebar></app-superadmin-sidebar>
<div class="managerinfo-wrapper">
  <!-- ✅ Custom Dropdown (No Blue Hover) -->
  <div class="role-selection-row">
    <div class="dropdown-wrapper" tabindex="0">
      <button class="fake-select">
        <span class="label">Delivery Partner</span>
        <span class="chev" aria-hidden="true">
          <svg
            class="dropdown-icon"
            width="40"
            height="40"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M7 10l5 5 5-5"
              stroke="rgba(31, 31, 31, 1)"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </button>

      <ul class="dropdown-panel">
        <li (click)="onRoleChangeCustom('manager')" class="dropdown-item">
          Manager
        </li>
        <li (click)="onRoleChangeCustom('chef')" class="dropdown-item">Chef</li>
        <li
          (click)="onRoleChangeCustom('delivery-partner')"
          class="dropdown-item"
        >
          Delivery Partner
        </li>
      </ul>
    </div>
  </div>

  <!-- Registration form -->

  <form
    [formGroup]="delPartnerForm"
    class="manager-form"
    (ngSubmit)="onSubmit()"
  >
    <div class="form-row">
      <div class="form-group">
        <label>Name</label>
        <input type="text" formControlName="name" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="dob">DOB</label>
        <input
          id="dob"
          type="text"
          placeholder="YYYY/MM/DD"
          formControlName="dateOfBirth"
        />
      </div>
      <div class="form-group">
        <label>Phone No.</label>
        <input type="text" formControlName="phone" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Kitchen Code</label>
        <input type="text" formControlName="kitchenCode" />
      </div>
      <div class="form-group file-group">
        <label>Photo (PDF/Image)</label>
        <input
          type="file"
          (change)="onFileSelected($event, 'photo')"
          accept=".pdf,image/*"
        />
        <span *ngIf="uploadedFiles.photo.uploaded"
          >✔ {{ uploadedFiles.photo.name }}</span
        >
      </div>
    </div>

    <div class="form-row">
      <div class="form-group file-group">
        <label>Aadhar</label>
        <input
          type="file"
          (change)="onFileSelected($event, 'aadhar')"
          accept=".pdf,image/*"
        />
        <span *ngIf="uploadedFiles.aadhar.uploaded"
          >✔ {{ uploadedFiles.aadhar.name }}</span
        >
      </div>
      <div class="form-group file-group">
        <label>PAN Card</label>
        <input
          type="file"
          (change)="onFileSelected($event, 'pan')"
          accept=".pdf,image/*"
        />
        <span *ngIf="uploadedFiles.pan.uploaded"
          >✔ {{ uploadedFiles.pan.name }}</span
        >
      </div>
    </div>

    <div class="form-row">
      <div class="form-group file-group">
        <label>Vehicle Insurance</label>
        <input
          type="file"
          (change)="onFileSelected($event, 'vehicleInsurance')"
          accept=".pdf,image/*"
        />
        <span *ngIf="uploadedFiles.insurance.uploaded"
          >✔ {{ uploadedFiles.vehicleInsurance.name }}</span
        >
      </div>

      <div class="form-group file-group">
        <label>Driving License</label>
        <input
          type="file"
          (change)="onFileSelected($event, 'drivingLicense')"
          accept=".pdf,image/*"
        />
        <span *ngIf="uploadedFiles.license.uploaded"
          >✔ {{ uploadedFiles.drivingLicense.name }}</span
        >
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Bank Account No.</label>
        <input type="text" formControlName="bankAccountNum" />
      </div>
      <div class="form-group">
        <label>IFSC Code</label>
        <input type="text" formControlName="ifsc" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group file-group">
        <label>Cheque Book</label>
        <input
          type="file"
          (change)="onFileSelected($event, 'chequeBook')"
          accept=".pdf,image/*"
        />
        <span *ngIf="uploadedFiles.chequeBook.uploaded"
          >✔ {{ uploadedFiles.chequeBook.name }}</span
        >
      </div>
      <div class="form-group">
        <label>Vehial No</label>
        <input type="text" formControlName="vehicleNumber" />
      </div>
    </div>

    <div class="form-group full">
      <label>Permanent Address</label>
      <input type="text" formControlName="permanentAddress" />
    </div>

    <div class="form-group full">
      <label>Current Address</label>
      <textarea formControlName="currentAddress"></textarea>
    </div>

    <div class="submit-row">
      <button type="submit">Submit</button>
    </div>
  </form>
</div>
