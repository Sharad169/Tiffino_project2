<div class="main-layout-wrapper">
  <div class="sidebar-panel">
    <div class="location-row">
      <i class="fas fa-map-marker-alt"></i>
      <span class="location-text">Pune, Maharashtra</span>
    </div>
 
    <div class="profile-section">
      <span class="back-link" (click)="goBack()">
        <i class="fa-solid fa-angle-left"></i> Back
      </span>
      <h1 class="profile-title">Profile</h1>
    </div>
 
    <div class="sidebar-nav">
      <ul class="nav-list">
        <li class="nav-item highlight" [class.active]="isRegistrationActive()">
          <a routerLink="/managerregi" class="nav-link">Registration Form</a>
        </li>
 
        <li class="nav-item highlight" [class.active]="isCloudKitchenActive()">
          <a routerLink="/superadmincloudkitchen" class="nav-link">
            Cloud Kitchen registration
          </a>
        </li>
 
        <li class="nav-item highlight" [class.active]="isEmployeeActive()">
          <a routerLink="/listemployee" class="nav-link">List of Employee</a>
        </li>
 
        <li class="nav-item highlight" [class.active]="isKitchenActive()">
          <a routerLink="/superadminkitchen" class="nav-link">
            List of Kitchen
          </a>
        </li>
 
        <li class="nav-item highlight" [class.active]="isEditEmployeeActive()">
          <a routerLink="/superadmineditlist" class="nav-link">
            Edit Employee Information
          </a>
        </li>
 
        <li
          class="nav-item highlight"
          [class.active]="isSubscriberListActive()"
        >
          <a routerLink="/superadminsubscriberlist" class="nav-link">
            Subscriber List
          </a>
        </li>
      </ul>
    </div>
  </div>
 
  <div class="content-panel">
    <div class="header-top-row">
      <p class="greeting">Good Morning, Super Admin</p>
      <div class="action-icons">
        <div class="help-large-box">
          <div class="help-small-box">?</div>
        </div>
        <div class="notification-circle">
          <i class="fas fa-bell"></i>
        </div>
      </div>
    </div>
 
    <div class="search-row">
      <div class="search-box">
        <input type="text" placeholder="Search" />
        <button class="menu-btn">☰</button>
      </div>
    </div>
  </div>
</div>
