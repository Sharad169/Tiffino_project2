<div class="user-sign-wrapper">
  <div class="login-wrapper">
    <div class="login-container login-section">
      <div class="login-form-wrapper">
        <h2>Create Password</h2>
        <p>First time login</p>
 
        <form>
          <!-- EMAIL FIELD (used as managerCode) -->
          <div class="form-group">
            <label>Employee Code</label>
            <input
              type="text"
              placeholder="Enter your employee code"
              [(ngModel)]="email"
              name="email"
              required
            />
          </div>
 
          <!-- TEMP PASSWORD -->
          <div class="form-group">
            <label>Temporary Password</label>
            <input
              type="password"
              placeholder="Enter temporary password"
              [(ngModel)]="tempPassword"
              name="tempPassword"
              required
            />
          </div>
 
          <!-- NEW PASSWORD -->
          <div class="form-group">
            <label>Set New Password</label>
            <input
              type="password"
              placeholder="Enter new password"
              [(ngModel)]="newPassword"
              name="newPassword"
              required
            />
          </div>
 
          <div class="button-group">
            <button
              type="button"
              class="btn btn-login"
              (click)="submitPassword()"
            >
              Submit
            </button>
          </div>
 
          <p class="help-text">
            <b>Please contact support&#64;shidori.in if needed</b>
          </p>
        </form>
      </div>
 
      <div class="side-panel">
        <h1>Let’s Get Started!</h1>
      </div>
    </div>
  </div>
</div>
