<header class="header">
  <div class="container">
    <!-- TOP ROW: logo | center nav | profile -->
    <div class="top-row">
      <!-- Logo -->
      <div class="logo">
        <img src="assets/logo.png" alt="Logo" />
      </div>

      <!-- Center Navigation -->
      <nav class="center-nav" aria-label="Main navigation">
        <a routerLink="/" class="nav-link" (click)="goToProfile()">Home</a>
        <a routerLink="/setting" class="nav-link">Setting</a>
        <a routerLink="/login" class="nav-link">Login</a>
        <a routerLink="/subscription" class="nav-link">Subscription Plan</a>
      </nav>

      <!-- User Identity (Profile Icon + Name) -->
      <div class="user-identity">
        <!-- SVG Profile Icon -->
        <svg
          class="profile-icon"
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <!-- Outer Circle -->
          <circle
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="2.5"
          />
          <!-- Inner Head Circle -->
          <circle
            cx="12"
            cy="9"
            r="3"
            stroke="currentColor"
            stroke-width="2.5"
          />
          <!-- Inner Body Arc -->
          <path
            d="M16 17C15.4294 16.4859 14.7352 16.0858 13.9678 15.8242C13.2005 15.5627 12.3789 15.4453 11.5544 15.4858C10.7299 15.5264 9.9192 15.7242 9.17649 16.068C8.43377 16.4118 7.77708 16.8943 7.24264 17.4852"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
          />
        </svg>
        <span class="user-name">Aaditya Salunkhe</span>
      </div>

      <!-- Only user name -->
      <div class="profile-name" (click)="goToProfile()">
        {{ name || "Profile" }}
      </div>
    </div>
    <!-- end of top-row -->

    <!-- BOTTOM ROW: location | search + filter -->
    <div class="bottom-row">
      <div class="location" aria-hidden="false">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
          <path
            d="M12 2C8.134 2 5 5.134 5 9c0 5.25 7 11 7 11s7-5.75 7-11c0-3.866-3.134-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"
            fill="currentColor"
          />
        </svg>
        <span class="location-text">Pune, Maharashtra</span>
      </div>

      <div class="search-block">
        <div class="search-pill">
          <input type="text" placeholder="Search" aria-label="search" />
          <button class="chev" type="button" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path
                d="M7 10l5 5 5-5"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>

        <button class="filter-btn" type="button" aria-label="filter">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path
              d="M4 6h16M10 12h4M6 18h12"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>Filter</span>
        </button>
      </div>
    </div>
    <!-- end of bottom-row -->
  </div>
  <!-- end of container -->
</header>
