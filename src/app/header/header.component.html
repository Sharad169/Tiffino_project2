<header class="header">
  <div class="container">
    <!-- TOP ROW: logo | center nav | profile -->
    <div class="top-row">
      <div class="logo">
        <img src="assets/logo.png" alt="Logo" />
      </div>

      <nav class="center-nav" aria-label="Main navigation">
        <a routerLink="/" class="nav-link" (click)="goToHome()">Home</a>
        <a routerLink="/setting" class="nav-link">Setting</a>
        <a routerLink="/login" class="nav-link">Login</a>
        <a routerLink="/subscription" class="nav-link">Subscription Plan</a>
        <a
  class="nav-link cart-icon"
  (click)="testRoute()"
  aria-label="Meals"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 -960 960 960"
    class="cart-svg"
    aria-hidden="true"
  >
    <path
      d="M280-80q-33 0-56.5-23.5T200-160q0-33 23.5-56.5T280-240q33 0 56.5 23.5T360-160q0 33-23.5 56.5T280-80Zm400 0q-33 0-56.5-23.5T600-160q0-33 23.5-56.5T680-240q33 0 56.5 23.5T760-160q0 33-23.5 56.5T680-80ZM246-720l96 200h280l110-200H246Zm-38-80h590q23 0 35 20.5t1 41.5L692-482q-11 20-29.5 31T622-440H324l-44 80h480v80H280q-45 0-68-39.5t-2-78.5l54-98-144-304H40v-80h130l38 80Z"
      fill="currentColor"
    />
  </svg>
</a>

      </nav>

      <!-- Profile (if needed) -->
      <!--
      <div class="profile">
        <div class="avatar">
          <img src="assets/avatar.png" alt="user avatar" />
        </div>
        <div class="profile-name">Profile Name</div>
      </div>
      -->

      <!-- Only user name --><div class="profile-name" style="    margin-right: -211px; gap: 12px;" (click)="goToProfile()">
                <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="currentColor"
          viewBox="0 0 24 24"
          class="profile-icon"
          style="margin-top: 6px;"
        >
          <path
            d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"
          />
        </svg>

    {{ name || 'Profile' }}
  </div>
      
    </div>
    <!-- end of top-row -->

    <!-- BOTTOM ROW: location | search + filter -->
    <div class="bottom-row">
      <div class="location" aria-hidden="false">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
          <path
            d="M12 2C8.134 2 5 5.134 5 9c0 5.25 7 11 7 11s7-5.75 7-11c0-3.866-3.134-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"
            fill="currentColor"
          />
        </svg>
        <span class="location-text">Pune, Maharashtra</span>
      </div>

      <div class="search-block">
        <div class="search-pill">
          <input type="text" placeholder="Search" aria-label="search" />
          <button class="chev" type="button" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path
                d="M7 10l5 5 5-5"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>

        <button class="filter-btn" type="button" aria-label="filter">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path
              d="M4 6h16M10 12h4M6 18h12"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>Filter</span>
        </button>
      </div>
    </div>
    <!-- end of bottom-row -->
  </div>
  <!-- end of container -->
</header>
