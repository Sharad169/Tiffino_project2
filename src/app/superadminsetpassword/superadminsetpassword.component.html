<div class="user-sign-wrapper">
  <div class="login-wrapper">
    <div class="login-container login-section" id="login-section">
      <!-- ===== Left Form ===== -->
      <div class="login-form-wrapper">
        <h2>Create Password</h2>
        <p>Log in with your email</p>
 
        <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
  <!-- Email Field -->
  <div class="form-group">
    <label>Email</label>
    <input type="email" placeholder="Enter your email" formControlName="email" required />
  </div>

  <!-- Old Password Field -->
  <div class="form-group">
    <label>Old Password</label>
    <input type="password" placeholder="Enter your old password" formControlName="oldPassword" required />
  </div>

  <!-- New Password Field -->
  <div class="form-group">
    <label>New Password</label>
    <input type="password" placeholder="Enter your new password" formControlName="newPassword" required />
  </div>

  <!-- Buttons -->
  <div class="button-group">
    <button type="submit" class="btn btn-login">Login</button>
    <button type="button" class="btn btn-outline" (click)="sendPassword()">Send Password</button>
  </div>

  <div class="signup-link-wrapper">
    <p>Don’t have an account?</p>
  </div>

  <p class="help-text">
    <b>Please contact support&#64;shidori.in or use the in-app Help section.</b>
  </p>
</form>

      </div>
 
      <!-- ===== Right Side Panel ===== -->
      <div class="side-panel">
        <h1>Let’s Get Started !</h1>
      </div>
    </div>
  </div>
</div>
