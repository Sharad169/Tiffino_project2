<div class="user-sign-wrapper">
  <div class="login-wrapper">
    <div class="login-container login-section" id="login-section">
      <!-- ===== Left Form ===== -->
      <div class="login-form-wrapper">
        <h2>Welcome Back to Tiffino</h2>
        <p>Log in with your email</p>
 
        <form>
          <!-- Email Field -->
          <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="Enter your email" required />
          </div>
 
          <!-- Password Field -->
          <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="Enter your password" required />
          </div>
 
          <!-- Buttons -->
          <div class="button-group">
            <button type="button" class="btn btn-login">Login</button>
            <button type="button" class="btn btn-outline">Send Password</button>
          </div>
 
          <div class="signup-link-wrapper">
            <p>
              Don’t have an account?
              <a href="#">Sign Up</a>
            </p>
          </div>
 
          <p class="help-text">
            <b>
              Please contact support&#64;shidori.in or use the in-app Help
              section.</b
            >
          </p>
        </form>
      </div>
 
      <!-- ===== Right Side Panel ===== -->
      <div class="side-panel">
        <h1>Let’s Get Started !</h1>
      </div>
    </div>
  </div>
</div>
