<div class="user-sign-wrapper">
  <div class="login-wrapper">
    <div class="login-container login-section" id="login-section">
      <!-- ===== Left Form ===== -->
     
      <div class="login-form-wrapper">
             <div class="manager-content">
    <!-- dropdown container -->
    <div class="dropdown-wrapper" tabindex="0">
      <button class="fake-select" aria-haspopup="listbox" aria-expanded="false">
        <span class="label">Select Role</span>
        <span class="chev" aria-hidden="true">
          <!-- down chevron SVG -->
          <svg
            class="dropdown-icon"
            width="40"
            height="40"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M7 10l5 5 5-5"
              stroke="rgba(31, 31, 31, 1)"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </button>

      <!-- dropdown panel (pure CSS show/hide using :focus-within) -->
      <ul class="dropdown-panel" role="listbox" aria-label="Employees">
        
        <li (click)="navigateTo('/superAdminLogin')" class="dropdown-item">
          Chef
        </li>
        <li (click)="navigateTo('/superadmindelpartner')" class="dropdown-item">
          Delivery Partner
        </li>
         <li (click)="navigateTo('/')" class="dropdown-item">
          User
        </li>
      </ul>
    </div>
  </div>
        <h2>Welcome Back to Shidori</h2>
        <p>Log in with your email</p>
 
        <form (ngSubmit)="onLogin()">
          <!-- Email Field -->
          <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" required />
    </div>
 
          <!-- Password Field -->
          <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" name="password" required />
    </div>
 
          <!-- Buttons -->
            <button type="submit">Login</button>
 
          <div class="signup-link-wrapper">
            <p>
              Don’t have an account?
              <a href="#">Sign Up</a>
            </p>
          </div>
 
          <p class="help-text">
            <b>
              Please contact support&#64;shidori.in or use the in-app Help
              section.</b
            >
          </p>
        </form>
      </div>
 
      <!-- ===== Right Side Panel ===== -->
      <div class="side-panel">
        <h1>Let’s Get Started !</h1>
      </div>
    </div>
  </div>
</div>
