<app-managersidebar></app-managersidebar>

<div class="managerinfo-wrapper">
  <div class="profile-details">
    <!-- USER INFO -->
    <div class="user-info">
      <img [src]="manager?.photo" alt="User" class="user-avatar" />

      <h3>{{ manager?.name || "—" }}</h3>
      <p class="email">{{ manager?.email || "—" }}</p>
    </div>

    <!-- FORM -->
    <form class="manager-form">
      <!-- ROW: Name + Email -->
      <div class="form-row">
        <div class="form-group">
          <label>Name</label>
          <input type="text" name="name" [(ngModel)]="manager.name" />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" [(ngModel)]="manager.email" />
        </div>
      </div>

      <!-- ROW: DOB + Phone -->
      <div class="form-row">
        <div class="form-group">
          <label>DOB</label>
          <input type="text" name="dob" [(ngModel)]="manager.dateOfBirth" />
        </div>

        <div class="form-group">
          <label>Phone No.</label>
          <input type="text" name="phone" [(ngModel)]="manager.phone" />
        </div>
      </div>

      <!-- ✅ ROW: Kitchen ID + Bank Account (SIDE BY SIDE) -->
      <div class="form-row">
        <div class="form-group">
          <label>Kitchen ID</label>
          <input
            type="text"
            name="kitchenId"
            [(ngModel)]="manager.kitchenCode"
          />
        </div>

        <div class="form-group">
          <label>Bank Account No.</label>
          <input
            type="text"
            name="bankAccount"
            [(ngModel)]="manager.bankAccountNum"
          />
        </div>
      </div>

      <!-- ROW: IFSC -->
      <div class="form-row">
        <div class="form-group">
          <label>IFSC Code</label>
          <input type="text" name="ifsc" [(ngModel)]="manager.ifsc" />
        </div>
      </div>

      <!-- Permanent Address -->
      <div class="form-group full">
        <label>Permanent Address</label>
        <textarea
          class="address-box"
          name="permanentAddress"
          [(ngModel)]="manager.permanentAddress"
        ></textarea>
      </div>

      <!-- Current Address -->
      <div class="form-group full">
        <label>Current Address</label>
        <textarea
          class="address-box"
          name="currentAddress"
          [(ngModel)]="manager.currentAddress"
        ></textarea>
      </div>

      <button
        class="edit-request-btn"
        routerLink="/manager-yourdetailssubmitpage"
      >
        Edit Request
      </button>
    </form>
  </div>
</div>
