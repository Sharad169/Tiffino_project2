<h2>{{ cuisineName }}</h2>

<div class="row">
  <div class="col-md-4" *ngFor="let meal of meals">
    <div class="card mb-4 shadow-sm">
      <img [src]="meal.imageUrl" class="card-img-top" [alt]="meal.name" style="height:200px;object-fit:cover;">
      <div class="card-body">
        <h5 class="card-title">{{ meal.name }}</h5>
        <p class="card-text">{{ meal.description }}</p>
        <p><strong>Price:</strong> ₹{{ meal.price }}</p>
        <button class="btn btn-success w-100" (click)="addToCart(meal)">Add to Cart</button>
      </div>
    </div>
  </div>
</div>
