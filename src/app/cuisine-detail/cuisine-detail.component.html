<div class="wrapper">
  <h2 class="section-title">{{ cuisineName }}</h2>

  <div class="cards-container">
    <div class="card" *ngFor="let meal of meals">
      <img [src]="meal.imageUrl" [alt]="meal.name" class="card-img" />

      <div class="card-body">
        <div class="card-top">
          <h3 class="card-title">{{ meal.name }}</h3>
          <div class="rating">
            <span class="stars">☆☆☆☆</span>
          </div>
        </div>

        <p class="card-text">{{ meal.description }}</p>

        <div class="price-cart">
          <span class="price">₹{{ meal.price }}</span>
          <button class="add-btn">Add to Cart</button>
        </div>
      </div>
    </div>
  </div>
</div>
