<div class="profile-container">
  <div class="top-row">
    <div class="top-actions"></div>
  </div>

  <div class="middle-row">
    <span class="location"> </span>
    <div class="search-box"></div>
  </div>

  <div class="bottom-row">
    <div class="back-link" [routerLink]="['/profile']" style="cursor: pointer">
      <i class="fas fa-angle-left back-icon"></i> Back
    </div>
  </div>

  <div class="profile">
    <p>Profile</p>
  </div>

  <!-- Main Section -->
  <div class="profile-section">
    <!-- Sidebar -->
    <app-sidebar></app-sidebar>

    <!-- Address + Orders + FAQs Section -->
    <div class="address-page">
      <div class="orders-section">
        <div class="faq-section">
          <h3>Delete Account</h3>

          <div class="faq-list">
            <div
              class="faq-item question-row"
              style="
                cursor: default;
                background-color: #f9f9f9;
                font-weight: 600;
              "
            >
              <span>Why did you decide to delete the account?</span>
            </div>

            <label class="faq-item">
              <span>I don’t use the app anymore</span>
              <input
                type="radio"
                name="reason"
                (click)="onReasonSelect('NoApp')"
                [checked]="selectedReason === 'NoApp'"
              />
              <span class="custom-radio"></span>
            </label>

            <label class="faq-item">
              <span>I’m not satisfied with the food quality or taste</span>
              <input
                type="radio"
                name="reason"
                (click)="onReasonSelect('BadFood')"
                [checked]="selectedReason === 'BadFood'"
              />
              <span class="custom-radio"></span>
            </label>

            <label class="faq-item">
              <span>I faced issues with delivery or timing</span>
              <input
                type="radio"
                name="reason"
                (click)="onReasonSelect('BadDelivery')"
                [checked]="selectedReason === 'BadDelivery'"
              />
              <span class="custom-radio"></span>
            </label>

            <label class="faq-item">
              <span>Prices are too high or offers are not attractive</span>
              <input
                type="radio"
                name="reason"
                (click)="onReasonSelect('HighPrice')"
                [checked]="selectedReason === 'HighPrice'"
              />
              <span class="custom-radio"></span>
            </label>

            <label class="faq-item">
              <span>The app is slow, buggy, or difficult to use</span>
              <input
                type="radio"
                name="reason"
                (click)="onReasonSelect('BadApp')"
                [checked]="selectedReason === 'BadApp'"
              />
              <span class="custom-radio"></span>
            </label>

            <label class="faq-item">
              <span>Customer support didn’t resolve my issue</span>
              <input
                type="radio"
                name="reason"
                (click)="onReasonSelect('BadSupport')"
                [checked]="selectedReason === 'BadSupport'"
              />
              <span class="custom-radio"></span>
            </label>

            <label class="faq-item">
              <span>I’m worried about my privacy or personal data</span>
              <input
                type="radio"
                name="reason"
                (click)="onReasonSelect('Privacy')"
                [checked]="selectedReason === 'Privacy'"
              />
              <span class="custom-radio"></span>
            </label>

            <label class="faq-item">
              <span>I prefer another food delivery app</span>
              <input
                type="radio"
                name="reason"
                (click)="onReasonSelect('OtherApp')"
                [checked]="selectedReason === 'OtherApp'"
              />
              <span class="custom-radio"></span>
            </label>

            <label class="faq-item">
              <span>I have duplicate or multiple accounts</span>
              <input
                type="radio"
                name="reason"
                (click)="onReasonSelect('Duplicate')"
                [checked]="selectedReason === 'Duplicate'"
              />
              <span class="custom-radio"></span>
            </label>

            <label class="faq-item">
              <span>Other</span>
              <input
                type="radio"
                name="reason"
                id="other-radio"
                (click)="onReasonSelect('Other')"
                [checked]="selectedReason === 'Other'"
              />
              <span class="custom-radio"></span>
            </label>
          </div>

          <!-- Textarea and Submit button (only visible for 'Other') -->
          <div class="text-input-section" *ngIf="isOtherSelected">
            <textarea
              class="user-text-box"
              placeholder="Write the text"
              [(ngModel)]="userText"
            ></textarea>
            <button
              type="button"
              class="custom-submit-btn"
              (click)="onSubmit()"
            >
              Submit
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
