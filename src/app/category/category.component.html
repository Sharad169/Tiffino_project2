<div class="cuisine-options">
  <button class="cuisine-btn" *ngFor="let option of cuisineOptions" (click)="filterCuisine(option)">
    {{ option }}
  </button>
</div>

<!-- Existing cuisine sections -->
<div *ngFor="let cuisine of cuisines" class="cuisine-section">
  <h2 class="cuisine-title">{{ cuisine.name }}</h2>

  <div class="meal-row">
    <div *ngFor="let meal of cuisine.meals" class="meal-card">
      <img [src]="meal.imageUrl" alt="{{ meal.name }}" class="meal-image" />
      <div class="meal-info">
        <h3 class="meal-name">{{ meal.name }}</h3>
        <p class="meal-desc">{{ meal.description }}</p>
        <p class="meal-price">Rs {{ meal.price }}</p>
        <button class="order-btn" (click)="addToCart(meal)">Add to Cart</button>
      </div>
    </div>
  </div>
</div>
