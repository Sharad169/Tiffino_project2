<!-- Cuisine Sections -->
<div *ngFor="let cuisine of cuisines" class="cuisine-section">
  <h2 class="cuisine-title">{{ cuisine.name }}</h2>

  <div class="meal-row-wrapper">
    <!-- Scrollable row -->
    <div class="meal-row" [id]="cuisine.name">
      <div
        class="meal-card"
        *ngFor="let meal of cuisine.meals"
        (click)="goToCuisineDetail(meal.id)"
      >
        <div class="meal-image-container">
          <img [src]="meal.imageUrl" alt="{{ meal.name }}" class="meal-image" />
          <button
            class="heart-btn"
            (click)="toggleLike(meal); $event.stopPropagation()"
            [class.liked]="meal.liked"
          >
            <i class="fa fa-heart"></i>
          </button>
        </div>

        <div class="meal-info">
          <h3 class="meal-name">{{ meal.name }}</h3>
          <div class="meal-rating">★★★★★</div>
          <p class="meal-desc">{{ meal.description }}</p>

          <div class="meal-bottom-row">
            <p class="meal-price">Rs {{ meal.price }}</p>
            <button
              class="order-btn"
              [disabled]="meal.adding"
              (click)="addToCart(meal); $event.stopPropagation()"
            >
              {{ meal.adding ? "Adding..." : "Add to Cart" }}
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Right arrow button -->
    <button
      class="scroll-btn right"
      (click)="scrollRight(cuisine.name); $event.stopPropagation()"
    >
      <span class="arrow-icon">&#8594;</span>
    </button>
  </div>
</div>
