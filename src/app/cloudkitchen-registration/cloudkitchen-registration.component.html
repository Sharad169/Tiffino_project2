<div class="cloudkitchen-page">
  <!-- Sidebar -->
  <app-superadmin-sidebar></app-superadmin-sidebar>

  <!-- Registration Form -->
  <div class="registration-container">
    <h2>Cloud Kitchen Registration</h2>
    <form>
      <div class="form-group">
        <label>Kitchen Name</label>
        <input type="text" placeholder="Enter Kitchen Name" />
      </div>

      <div class="form-group">
        <label>Owner Name</label>
        <input type="text" placeholder="Enter Owner Name" />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="Enter Email" />
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input type="text" placeholder="Enter Phone Number" />
      </div>

      <div class="form-group">
        <label>Address</label>
        <textarea placeholder="Enter Address"></textarea>
      </div>

      <button type="submit">Register Kitchen</button>
    </form>
  </div>
</div>
