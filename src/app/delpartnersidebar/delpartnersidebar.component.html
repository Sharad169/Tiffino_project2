<div class="main-layout-wrapper">
  <div class="sidebar-panel">
    <div class="location-row"></div>

    <!-- 🔴 Horizontally Centered Inactive Status (scrolls with page) -->
    <div class="inactive-status">
      <span class="inactive-text">Inactive</span>
      <div class="inactive-dot"></div>
    </div>

    <div class="profile-section">
      <span class="back-link" (click)="goBack()">
        <i class="fa-solid fa-angle-left"></i> Back
      </span>
    </div>

    <div class="sidebar-nav">
      <ul class="nav-list">
        <li
          class="nav-item highlight"
          [class.active]="isActive(dashboardRoutes)"
        >
          <a routerLink="/delpartnerdashboard" class="nav-link">Home</a>
        </li>

        <li
          class="nav-item highlight"
          [class.active]="isActive(currentOrderRoutes)"
        >
          <a routerLink="/yourcurrentorderdelpartner" class="nav-link"
            >Your current Order</a
          >
        </li>

        <li
          class="nav-item highlight"
          [class.active]="isActive(ordersDeliveredRoutes)"
        >
          <a routerLink="/delpartnerordersdeliverdbyyou" class="nav-link">
            Orders delivered by you
          </a>
        </li>

        <li
          class="nav-item highlight"
          [class.active]="isActive(helpSupportRoutes)"
        >
          <a routerLink="/delpartnerhelpsupportpage" class="nav-link"
            >Help Center</a
          >
        </li>

        <li
          class="nav-item highlight"
          [class.active]="isActive(yourDetailsRoutes)"
        >
          <a routerLink="/delpartneryourdetails" class="nav-link"
            >Your Details</a
          >
        </li>
      </ul>
    </div>
  </div>

  <div class="content-panel">
    <div class="header-top-row">
      <p class="greeting">Good Morning, Aditya</p>
      <div class="action-icons">
        <div class="help-large-box">
          <div class="help-small-box">?</div>
        </div>
        <div class="notification-circle">
          <i class="fas fa-bell notify"></i>
          <img src="/assets/aaditya.jpg" alt="user" class="profile-pic" />
        </div>
      </div>
    </div>

    <div class="search-row">
      <div class="search-box">
        <input type="text" placeholder="Search" />
        <button class="menu-btn">☰</button>
      </div>
    </div>
  </div>
</div>
