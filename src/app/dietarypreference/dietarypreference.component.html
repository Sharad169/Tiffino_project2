<nav class="filter-tabs">
  <div class="tab active-tab">Dietary Preferences</div>
  <div class="tab">Cuisine Type</div>
  <div class="tab">Meal Type</div>
  <div class="tab">Portion & Spice Levels</div>
  <div class="tab">Health & Nutrition</div>
</nav>

<div class="preferences-list-container">
  <label class="preference-item">
    <input type="radio" name="diet" (change)="showOtherInput = false" />
    <span class="custom-radio"></span>
    <span>Vegetarian</span>
  </label>

  <label class="preference-item">
    <input type="radio" name="diet" (change)="showOtherInput = false" />
    <span class="custom-radio"></span>
    <span>Non-Vegetarian</span>
  </label>

  <label class="preference-item">
    <input type="radio" name="diet" (change)="showOtherInput = false" />
    <span class="custom-radio"></span>
    <span>Vegan</span>
  </label>

  <label class="preference-item">
    <input type="radio" name="diet" (change)="showOtherInput = false" />
    <span class="custom-radio"></span>
    <span>Eggetarian</span>
  </label>

  <!-- ✅ Other option with dynamic input -->
  <label class="preference-item">
    <input type="radio" name="diet" (change)="showOtherInput = true" />
    <span class="custom-radio"></span>
    <span>Other</span>
  </label>

  <!-- Textbox shown only when "Other" selected -->
  <input
    *ngIf="showOtherInput"
    type="text"
    class="other-input"
    placeholder=""
  />
</div>

<div class="next-button-wrapper">
  <button class="next-button">Next</button>
</div>
