    >
      Dietary Preferences
    </button>
    <button
      class="option-btn"
      [class.active]="activeSection === 'cuisine'"

    >

    </button>
    <button
  class="option-btn"
  [class.active]="activeSection === 'mealType'"
  (click)="showSection('mealType')"
>
  Meal Type
</button>
    <button
  class="option-btn"
  [class.active]="activeSection === 'portionSpice'"
  (click)="showSection('portionSpice')"
>
  Portion & Spice Levels
</button>

  <button
  class="option-btn"
  [class.active]="activeSection === 'healthNutrition'"
  (click)="showSection('healthNutrition')"
>
  Health & Nutrition
</button>
    
<button
  class="option-btn"
  [class.active]="activeSection === 'allergens'"
  (click)="showSection('allergens')"
>
  Allergens
</button>
  
<button
  class="option-btn"
  [class.active]="activeSection === 'specials'"
  (click)="showSection('specials')"
>
  Specials
</button>
     
<button
  class="option-btn"
  [class.active]="activeSection === 'priceRange'"
  (click)="showSection('priceRange')"
>
  Price Range
</button>

  <button
  class="option-btn"
  [class.active]="activeSection === 'ratingsReviews'"
  (click)="showSection('ratingsReviews')"
>
  Ratings & Reviews
</button>

  </div>
</div>

<!-- Dietary Preferences Section -->
<div *ngIf="activeSection === 'dietary'" class="content-section">
  <div class="option-item" *ngFor="let option of dietaryOptions">
    <label>
      <input
        type="radio"
        name="dietary"
        [value]="option"
        [(ngModel)]="selectedDietary"
      />
      {{ option }}
    </label>
    <input
      *ngIf="selectedDietary === option"
      type="text"
      placeholder="Enter details..."
      class="input-box"
    />
  </div>

  <button class="next-btn">Next</button>
</div>
