<app-superadmin-sidebar></app-superadmin-sidebar>

<div class="form-wrapper">
  <form [formGroup]="addressForm" (ngSubmit)="onSubmit()">
    <div class="row">
      <div class="form-group">
        <label>Name</label>
        <input type="text" formControlName="name" />
        <small *ngIf="addressForm.get('name')?.touched && addressForm.get('name')?.invalid" class="error">Name is required</small>
      </div>

      <div class="form-group">
        <label>City</label>
        <input type="text" formControlName="city" />
        <small *ngIf="addressForm.get('city')?.touched && addressForm.get('city')?.invalid" class="error">City is required</small>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Pin</label>
        <input type="text" formControlName="pin" />
        <small *ngIf="addressForm.get('pin')?.touched && addressForm.get('pin')?.invalid" class="error">Valid 6-digit PIN required</small>
      </div>

      <div class="form-group">
        <label>State</label>
        <input type="text" formControlName="state" />
        <small *ngIf="addressForm.get('state')?.touched && addressForm.get('state')?.invalid" class="error">State is required</small>
      </div>
    </div>

    <div class="form-group full-width">
      <label>Region</label>
      <input type="text" formControlName="region" />
      <small *ngIf="addressForm.get('region')?.touched && addressForm.get('region')?.invalid" class="error">Region is required</small>
    </div>

    <div class="form-group full-width">
      <label>Permanent Address</label>
      <input type="text" formControlName="address" />
      <small *ngIf="addressForm.get('address')?.touched && addressForm.get('address')?.invalid" class="error">Address is required</small>
    </div>

    <div class="btn-wrapper">
      <button type="submit">Submit</button>
    </div>
  </form>
</div>
