<app-superadmin-sidebar></app-superadmin-sidebar>
<div class="managerinfo-wrapper">
  <!-- Dropdown for role -->

  <div class="role-selection-row">
    <div class="dropdown-wrapper" tabindex="0">
      <button class="fake-select">
        <span class="label">Chef</span>
        <span class="chev" aria-hidden="true">
          <svg
            class="dropdown-icon"
            width="40"
            height="40"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M7 10l5 5 5-5"
              stroke="rgba(31, 31, 31, 1)"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </button>

      <ul class="dropdown-panel">
        <li (click)="onRoleChangeCustom('manager')" class="dropdown-item">
          Manager
        </li>
        <li (click)="onRoleChangeCustom('chef')" class="dropdown-item">Chef</li>
        <li
          (click)="onRoleChangeCustom('delivery-partner')"
          class="dropdown-item"
        >
          Delivery Partner
        </li>
      </ul>
    </div>
  </div>

  <!-- Registration form -->
  <form class="manager-form" [formGroup]="chefForm" (ngSubmit)="onSubmit()">
    <div class="form-row">
      <div class="form-group">
        <label for="name">Name</label>
        <input id="name" type="text" formControlName="name" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="dob">DOB</label>
        <input
          id="dob"
          type="text"
          placeholder="YYYY/MM/DD"
          formControlName="dateOfBirth"
        />
      </div>
      <div class="form-group">
        <label for="phone">Phone No.</label>
        <input id="phone" type="text" formControlName="phone" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="kitchen-id">Kitchen ID</label>
        <input id="kitchen-id" type="text" formControlName="kitchenCode" />
      </div>
      <div class="form-group file-group">
        <label for="photo">Photo</label>

        <div class="custom-file-input">
          <span class="file-placeholder">PDF</span>
          <input
            id="photo"
            type="file"
            (change)="onFileSelected($event, 'photo')"
            accept=".pdf,image/*"
          />
        </div>

        <!-- ✅ BELOW INPUT -->
        <span *ngIf="uploadedFiles.photo.uploaded" class="file-success">
          ✔️ {{ uploadedFiles.photo.name }}
        </span>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group file-group">
        <label for="aadhar">Aadhar No.</label>

        <div class="custom-file-input">
          <span class="file-placeholder">PDF</span>
          <input
            id="aadhar"
            type="file"
            (change)="onFileSelected($event, 'aadhar')"
            accept=".pdf,image/*"
          />
        </div>

        <span *ngIf="uploadedFiles.aadhar.uploaded" class="file-success">
          ✔️ {{ uploadedFiles.aadhar.name }}
        </span>
      </div>
      <div class="form-group file-group">
        <label for="pan-card">PAN card No.</label>

        <div class="custom-file-input">
          <span class="file-placeholder">PDF</span>
          <input
            id="pan-card"
            type="file"
            (change)="onFileSelected($event, 'panCard')"
            accept=".pdf,image/*"
          />
        </div>

        <span *ngIf="uploadedFiles.panCard.uploaded" class="file-success">
          ✔️ {{ uploadedFiles.panCard.name }}
        </span>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="bank-acct">Bank Account No.</label>
        <input id="bank-acct" type="text" formControlName="bankAccountNum" />
      </div>
      <div class="form-group file-group">
        <label for="cheque-book">Cheque Book</label>

        <div class="custom-file-input">
          <span class="file-placeholder">PDF</span>
          <input
            id="cheque-book"
            type="file"
            (change)="onFileSelected($event, 'chequeBook')"
            accept=".pdf,image/*"
          />
        </div>

        <span *ngIf="uploadedFiles.chequeBook.uploaded" class="file-success">
          ✔️ {{ uploadedFiles.chequeBook.name }}
        </span>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>IFSC Code</label>
        <textarea
          class="address-box ifsc-box"
          formControlName="ifsc"
        ></textarea>
      </div>
    </div>
    <div class="form-group full">
      <label for="chef-specialization">Chef Specialization</label>
      <textarea
        id="chef-specialization"
        class="address-box"
        formControlName="specialization"
      ></textarea>
    </div>

    <div class="form-group full">
      <label for="perm-address">Permanent Address</label>
      <textarea
        id="perm-address"
        class="address-box"
        formControlName="permanentAddress"
      ></textarea>
    </div>

    <div class="form-group full">
      <label for="curr-address">Current Address</label>
      <textarea
        id="curr-address"
        class="address-box"
        formControlName="currentAddress"
      ></textarea>
    </div>

    <div class="submit-row">
      <button type="submit">Submit</button>
    </div>
  </form>
</div>
