<app-delpartnersidebar></app-delpartnersidebar>

<div class="managerinfo-wrapper">
  <div class="profile-details">
    <div class="user-info">
      <img src="/assets/aaditya.jpg" alt="User" class="user-avatar" />
      <h3>Ravi Sharma</h3>
      <p class="email">Ravisharma&#64;gmail.com</p>
    </div>

    <form class="manager-form">
      <!-- ROW 1 -->
      <div class="form-row">
        <div class="form-group">
          <label>Name</label>
          <input type="text" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" />
        </div>
      </div>

      <!-- ROW 2 -->
      <div class="form-row">
        <div class="form-group">
          <label>DOB</label>
          <input type="text" placeholder="YYYY/MM/DD" disabled />
        </div>
        <div class="form-group">
          <label>Phone No.</label>
          <input type="text" />
        </div>
      </div>

      <!-- ROW 3 -->
      <div class="form-row">
        <div class="form-group">
          <label>Kitchen ID</label>
          <input type="text" disabled />
        </div>
        <div class="form-group">
          <label>Vehicle No.</label>
          <input type="text" />
        </div>
      </div>

      <!-- ROW 4 -->
      <div class="form-row">
        <div class="form-group file-group">
          <label>Aadhar No.</label>
          <div class="custom-file-input">
            <span class="file-placeholder">Choose File</span>
            <input type="file" />
          </div>
        </div>

        <div class="form-group file-group">
          <label>PAN Card No.</label>
          <div class="custom-file-input">
            <span class="file-placeholder">Choose File</span>
            <input type="file" disabled />
          </div>
        </div>
      </div>

      <!-- ROW 5 -->
      <div class="form-row">
        <div class="form-group file-group">
          <label>Vehicle Insurance</label>
          <div class="custom-file-input">
            <span class="file-placeholder">Choose File</span>
            <input type="file" />
          </div>
        </div>

        <div class="form-group file-group">
          <label>Driving Licence</label>
          <div class="custom-file-input">
            <span class="file-placeholder">Choose File</span>
            <input type="file" disabled />
          </div>
        </div>
      </div>

      <!-- ROW 6 -->
      <div class="form-row">
        <div class="form-group file-group">
          <label>Photo</label>
          <div class="custom-file-input">
            <span class="file-placeholder">Choose File</span>
            <input type="file" />
          </div>
        </div>

        <div class="form-group">
          <label>Bank Account No.</label>
          <input type="text" disabled />
        </div>
      </div>

      <!-- Cheque Book -->
      <div class="form-group file-group full">
        <label>Cheque Book</label>
        <div class="custom-file-input">
          <span class="file-placeholder">Choose File</span>
          <input type="file" />
        </div>
      </div>

      <!-- Permanent Address -->
      <div class="form-group full">
        <label>Permanent Address</label>
        <textarea class="address-box"></textarea>
      </div>

      <!-- Current Address -->
      <div class="form-group full">
        <label>Current Address</label>
        <textarea class="address-box"></textarea>
      </div>

      <button type="button" class="start-btn" (click)="openPopup()">
        Start Order
      </button>
    </form>
  </div>
</div>

<!-- POPUP -->
<div class="popup-overlay" *ngIf="showPopup">
  <div class="popup-box">
    <h2>Yohoooo!</h2>
    <p>Your request is successfully sent</p>
  </div>
</div>
